<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài 5 – Chuông quầy nước</title>
<!-- Bài 5: thử realtime trên bảng THỬ don_nuoc_thu. Không phải app thật. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<style>
  :root { --nen:#fff8ee; --chu:#2b1d0e; --chinh:#c0392b; --xanh:#1e8449; --xam:#888; --the:#fff; --vien:#e5d5bf; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Roboto, sans-serif; background:var(--nen); color:var(--chu); }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 16px; background:var(--chu); color:#fff; }
  header h1 { font-size:18px; margin:0; }
  #trangthai { font-size:13px; padding:4px 10px; border-radius:99px; background:var(--xam); white-space:nowrap; }
  #trangthai.ok { background:var(--xanh); } #trangthai.loi { background:var(--chinh); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  button { font:inherit; border:0; border-radius:12px; cursor:pointer; }
  .to { width:100%; padding:18px; font-size:20px; font-weight:700; color:#fff; background:var(--chinh); margin-bottom:12px; }
  .to.xanh { background:var(--xanh); }
  .an { display:none !important; }
  .the { background:var(--the); border:1px solid var(--vien); border-radius:14px; padding:14px; margin-bottom:12px; }
  label { font-weight:700; display:block; margin-bottom:6px; }
  input[type=number] { width:100%; font-size:28px; padding:10px; border:2px solid var(--vien); border-radius:10px; }
  input[type=text] { width:100%; font-size:18px; padding:10px; border:2px solid var(--vien); border-radius:10px; margin-bottom:12px; }
  .nhan-gc { margin-top:4px; }
  .nhac { font-size:14px; color:#8a5a00; margin-bottom:6px; }
  .luoi { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .mon { padding:16px 6px; font-size:16px; font-weight:700; background:#f3e3cc; color:var(--chu); }
  #gio { min-height:28px; margin:10px 0; font-size:18px; }
  .hang { display:flex; gap:8px; }
  .hang button { flex:1; }
  .phu { padding:14px; font-size:16px; background:#ddd; color:var(--chu); }
  #dodo { font-size:15px; color:var(--xanh); min-height:20px; margin-top:6px; }
  h2 { font-size:17px; margin:18px 0 8px; }
  .don { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--the); border:2px solid var(--vien); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .don .ban { font-size:26px; font-weight:800; }
  .don .nd { font-size:20px; }
  .don .gio { font-size:13px; color:var(--xam); }
  .don .gc { display:inline-block; margin:4px 0; padding:3px 10px; background:#ffe08a; border-radius:8px; font-size:18px; font-weight:700; }
  .don button { padding:16px 18px; font-size:18px; font-weight:700; background:var(--xanh); color:#fff; }
  .don.moi { animation: nhay 0.4s 4 alternate; }
  @keyframes nhay { to { background:#ffe08a; } }
  #batam { background:#e67e22; }
  .trong { color:var(--xam); text-align:center; padding:20px; }
  #man-chon p { line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1 id="tieude">Bài 5 – Chuông quầy nước</h1>
  <span id="trangthai">Đang kết nối…</span>
</header>
<main>
  <!-- Màn chọn -->
  <section id="man-chon">
    <p>Mở trang này trên <b>2 máy</b> (hoặc 2 tab): một bên chọn <b>Phục vụ</b>, một bên chọn <b>Quầy nước</b>.</p>
    <button class="to" onclick="chonMan('phucvu')">Phục vụ (gửi đơn nước)</button>
    <button class="to xanh" onclick="chonMan('nuoc')">Quầy nước (nhận đơn, có chuông)</button>
  </section>

  <!-- Màn phục vụ -->
  <section id="man-phucvu" class="an">
    <div class="the">
      <label for="soban">Số bàn</label>
      <input id="soban" type="number" inputmode="numeric" min="1" max="99" placeholder="vd 5">
    </div>
    <div class="the">
      <label>Chạm để thêm nước</label>
      <div class="luoi">
        <button class="mon" onclick="themMon('nước mía')">Nước mía</button>
        <button class="mon" onclick="themMon('rau má')">Rau má</button>
        <button class="mon" onclick="themMon('nước ngọt')">Nước ngọt</button>
      </div>
      <div id="gio"></div>
      <label for="ghichu" class="nhan-gc">Ghi chú (không bắt buộc)</label>
      <div class="nhac">Hỏi rõ khách: <b>ly nào</b> ít đá / ít ngọt, mấy ly.</div>
      <input id="ghichu" type="text" maxlength="100" placeholder="vd: 1 rau má ít ngọt, 2 nước mía ít đá">
      <div class="hang">
        <button class="phu" onclick="xoaGio()">Xóa chọn</button>
        <button class="to" style="margin:0" onclick="guiDon()">Gửi quầy nước</button>
      </div>
      <div id="dodo"></div>
    </div>
  </section>

  <!-- Màn quầy nước -->
  <section id="man-nuoc" class="an">
    <button id="batam" class="to" onclick="batAmBao()">🔔 Bật âm báo (chạm 1 lần đầu ca)</button>
  </section>

  <section id="khu-don" class="an">
    <h2 id="tieude-don">Đơn nước đang chờ</h2>
    <div id="dsdon"></div>
  </section>
</main>

<script>
// ===== Kết nối kho Singapore (publishable key được phép công khai) =====
const SB_URL = 'https://utkqaphrzdeevrhxrtxw.supabase.co';
const SB_KEY = 'sb_publishable_aV8B_uwJs_ciqF_NXRyY6Q_AnbkyApX';
const sb = supabase.createClient(SB_URL, SB_KEY);

let man = null;            // 'phucvu' | 'nuoc'
const don = new Map();     // id -> dòng đơn
let gio = {};              // món đang chọn: { 'nước mía': 2 }
let amCtx = null;          // bộ phát âm thanh (cần chạm 1 lần mới được kêu)
let giuSang = null;        // giữ màn hình sáng
const doTre = { t0: null, id: null, den: {} };  // đo thời gian chuông kêu

// ===== Chọn màn =====
function chonMan(m) {
  man = m;
  location.hash = m;
  document.getElementById('man-chon').classList.add('an');
  document.getElementById('man-' + m).classList.remove('an');
  document.getElementById('khu-don').classList.remove('an');
  document.getElementById('tieude').textContent = m === 'nuoc' ? 'Quầy nước' : 'Phục vụ';
  veDanhSach();
}

// ===== Phục vụ: chọn món, gửi đơn =====
function themMon(ten) { gio[ten] = (gio[ten] || 0) + 1; veGio(); }
function xoaGio() { gio = {}; veGio(); }
function chuoiGio() { return Object.entries(gio).map(([t, n]) => n + ' ' + t).join(', '); }
function veGio() { document.getElementById('gio').textContent = chuoiGio() || 'Chưa chọn nước nào'; }

async function guiDon() {
  const soBan = parseInt(document.getElementById('soban').value, 10);
  const noiDung = chuoiGio();
  const ghiChu = document.getElementById('ghichu').value.trim();
  if (!soBan || soBan < 1 || soBan > 99) return alert('Nhập số bàn (1–99).');
  if (!noiDung) return alert('Chạm chọn ít nhất 1 nước.');
  document.getElementById('dodo').textContent = 'Đang gửi…';
  doTre.t0 = performance.now(); doTre.id = null;
  const { data, error } = await sb.from('don_nuoc_thu')
    .insert({ so_ban: soBan, noi_dung: noiDung, ghi_chu: ghiChu || null }).select('id').single();
  if (error) { document.getElementById('dodo').textContent = ''; return baoLoi('Gửi đơn', error); }
  doTre.id = data.id;
  xoaGio();
  document.getElementById('ghichu').value = '';
  baoDoTre();
}

// Thời gian từ lúc bấm Gửi tới lúc kho đẩy đơn ngược về máy này (gần bằng lúc máy mẹ kêu)
function baoDoTre() {
  if (doTre.id == null || doTre.den[doTre.id] == null) return;
  const ms = Math.round(doTre.den[doTre.id] - doTre.t0);
  document.getElementById('dodo').textContent = '✓ Đã gửi. Kho báo về sau ' + ms + ' ms' + (ms < 1000 ? ' (dưới 1 giây)' : ' (CHẬM hơn 1 giây)');
  doTre.id = null;
}

// ===== Quầy nước: âm báo, xong đơn =====
function batAmBao() {
  try {
    amCtx = amCtx || new (window.AudioContext || window.webkitAudioContext)();
    amCtx.resume();
    chuong();
    document.getElementById('batam').classList.add('an');
  } catch (e) { alert('Máy này không phát được âm báo: ' + e.message); }
  giuManHinhSang();
}

function chuong() {
  if (!amCtx) return;
  const t = amCtx.currentTime;
  for (let i = 0; i < 3; i++) {             // 3 tiếng "ding-dong"
    [880, 1320].forEach((tanSo, j) => {
      const o = amCtx.createOscillator(), g = amCtx.createGain();
      o.type = 'triangle'; o.frequency.value = tanSo;
      const bd = t + i * 0.6 + j * 0.18;
      g.gain.setValueAtTime(0.0001, bd);
      g.gain.exponentialRampToValueAtTime(0.9, bd + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, bd + 0.5);
      o.connect(g).connect(amCtx.destination);
      o.start(bd); o.stop(bd + 0.55);
    });
  }
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
}

async function giuManHinhSang() {
  try { if ('wakeLock' in navigator) giuSang = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && man === 'nuoc' && amCtx) giuManHinhSang();
});

async function xong(id) {
  const { error } = await sb.from('don_nuoc_thu').delete().eq('id', id);
  if (error) return baoLoi('Bấm Xong', error);
  don.delete(id); veDanhSach();
}

// ===== Danh sách đơn (cả 2 màn đều thấy) =====
function veDanhSach(idMoi) {
  const ds = document.getElementById('dsdon');
  ds.innerHTML = '';
  const hang = [...don.values()].sort((a, b) => a.tao_luc.localeCompare(b.tao_luc));
  document.getElementById('tieude-don').textContent = 'Đơn nước đang chờ (' + hang.length + ')';
  if (!hang.length) { ds.innerHTML = '<div class="trong">Không có đơn nào đang chờ</div>'; return; }
  for (const d of hang) {
    const the = document.createElement('div');
    the.className = 'don' + (d.id === idMoi ? ' moi' : '');
    const trai = document.createElement('div');
    const ban = document.createElement('div'); ban.className = 'ban'; ban.textContent = 'Bàn ' + d.so_ban;
    const nd = document.createElement('div'); nd.className = 'nd'; nd.textContent = d.noi_dung;
    const gio = document.createElement('div'); gio.className = 'gio';
    gio.textContent = new Date(d.tao_luc).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    trai.append(ban, nd);
    if (d.ghi_chu) {
      const gc = document.createElement('div'); gc.className = 'gc'; gc.textContent = '📝 ' + d.ghi_chu;
      trai.append(gc);
    }
    trai.append(gio);
    the.append(trai);
    if (man === 'nuoc') {
      const nut = document.createElement('button'); nut.textContent = 'Xong';
      nut.onclick = () => xong(d.id);
      the.append(nut);
    }
    ds.append(the);
  }
}

async function taiLai() {
  const { data, error } = await sb.from('don_nuoc_thu').select('*').order('tao_luc');
  if (error) return baoLoi('Tải đơn', error);
  don.clear(); data.forEach(d => don.set(d.id, d)); veDanhSach();
}

// ===== Realtime: kho tự đẩy đơn mới / đơn xong xuống mọi máy đang mở =====
function trangThai(chu, loai) {
  const el = document.getElementById('trangthai');
  el.textContent = chu; el.className = loai || '';
}

sb.channel('quay-nuoc')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'don_nuoc_thu' }, (p) => {
    if (p.eventType === 'INSERT') {
      doTre.den[p.new.id] = performance.now();
      don.set(p.new.id, p.new);
      veDanhSach(p.new.id);
      if (man === 'nuoc') chuong();
      if (man === 'phucvu') baoDoTre();
    } else if (p.eventType === 'DELETE') {
      don.delete(p.old.id); veDanhSach();
    }
  })
  .subscribe((st, err) => {
    if (st === 'SUBSCRIBED') { trangThai('Đã kết nối', 'ok'); taiLai(); }
    else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { trangThai('Mất kết nối', 'loi'); if (err) console.error(err); }
    else if (st === 'CLOSED') trangThai('Đã ngắt', 'loi');
  });

function baoLoi(viec, error) {
  console.error(viec, error);
  let goiY = '';
  if (error.code === '42501') goiY = '\n→ Thiếu quyền (grant/policy).';
  if (error.code === '42P01' || /does not exist/.test(error.message)) goiY = '\n→ Bảng don_nuoc_thu chưa được tạo.';
  alert(viec + ' bị lỗi: ' + error.message + goiY);
}

// Mở thẳng màn nếu link có #phucvu hoặc #nuoc
if (location.hash === '#phucvu' || location.hash === '#nuoc') chonMan(location.hash.slice(1));
veGio();
</script>
</body>
</html>
