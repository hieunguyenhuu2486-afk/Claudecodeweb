<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đối thoại – Quán Bảy</title>
<!-- Bài 9: Đối thoại phục vụ ↔ bếp xèo / bếp căn (bảng tin_nhan + hàm gui_tin; tin thoại dùng chỗ chứa "tin-thoai" của 6.5).
     Hieu chốt 20/11: phục vụ gửi → máy bếp TỰ kêu + TỰ đọc chữ / TỰ phát tin thoại (không phải bấm).
     Bếp gửi → máy phục vụ kêu "ting", bấm ▶ mới nghe.
     Dùng riêng được, hoặc nhúng làm mục "Đối thoại" (?nhung=1) trong màn bếp / màn phục vụ.
     Chỉ chứa publishable key (được phép công khai). -->
<style>
  :root { --nen:#fff8ee; --chu:#2b1d0e; --do:#c0392b; --xanh:#1e8449; --cam:#e67e22; --xam:#7a6a58; --vien:#e5d5bf; --vang:#fff3c4; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:var(--nen); color:var(--chu); }
  header { position:sticky; top:0; z-index:6; padding:12px 16px; background:var(--chu); color:#fff; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:18px; }
  #ketnoi { font-size:12px; color:#ccc; }
  html.nhung header { display:none; }
  main { max-width:620px; margin:0 auto; padding:12px 12px 30px; }
  .the { background:#fff; border:1px solid var(--vien); border-radius:16px; padding:12px 14px; margin-bottom:12px; }
  h2 { margin:0 0 10px; font-size:19px; }
  button { font:inherit; border:0; border-radius:12px; cursor:pointer; }
  button:disabled { opacity:.45; }
  input { width:100%; font-size:18px; padding:12px; border:2px solid var(--vien); border-radius:12px; font-family:inherit; }
  .goi-y { font-size:14px; color:var(--xam); }
  .canh { padding:12px 14px; border-radius:12px; background:#fff1e0; color:#8a4500; font-size:16px; margin-bottom:12px; }
  .canh a { font-weight:800; color:inherit; }
  .loi { padding:12px; border-radius:10px; background:#fdecea; color:var(--do); font-weight:700; }
  .lon { width:100%; padding:16px; font-size:19px; font-weight:900; background:var(--cam); color:#fff; margin-top:10px; }
  .toi { display:flex; gap:6px; margin-bottom:10px; }
  .toi button { flex:1; padding:13px 4px; font-size:17px; font-weight:900; background:#eee; color:var(--chu); }
  .toi button.chon { background:var(--chu); color:#fff; }
  .hang-go { display:flex; gap:6px; }
  .hang-go input { flex:1; min-width:0; }
  .nut { padding:12px 14px; font-weight:900; font-size:16px; color:#fff; background:var(--xanh); white-space:nowrap; }
  .nut.vien { background:#fff; color:var(--chu); border:2px solid var(--vien); }
  .ghi { width:100%; margin-top:10px; padding:20px 12px; font-size:19px; font-weight:900; background:var(--do); color:#fff;
         user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none; }
  .ghi.dang { background:#7b241c; animation:nhayGhi 1s infinite; }
  @keyframes nhayGhi { 50% { opacity:.7; } }
  .tin { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid #f1e6d6; }
  .tin:first-child { border-top:0; }
  .tin .noi { flex:1; }
  .tin .ai { font-size:14px; font-weight:800; color:var(--xam); }
  .tin .chu { font-size:19px; font-weight:700; margin-top:2px; }
  .tin.den { background:#fff8e1; margin:0 -14px; padding:10px 14px; }
  .tin.moi { background:#fde2df; }
  .cham { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--do); margin-right:4px; }
  .bao { position:fixed; left:12px; right:12px; bottom:16px; background:#222; color:#fff; padding:14px; border-radius:12px; font-size:16px; z-index:9; display:none; }
  .tt { text-align:center; color:var(--xam); padding:24px 0; }
</style>
</head>
<body>
<header><h1>💬 Đối thoại</h1><span id="ketnoi"></span></header>
<main id="man"><div class="tt">Đang kiểm tra đăng nhập…</div></main>
<div class="bao" id="bao"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script>
const URL_KHO = 'https://utkqaphrzdeevrhxrtxw.supabase.co';
const KHOA_CONG_KHAI = 'sb_publishable_aV8B_uwJs_ciqF_NXRyY6Q_AnbkyApX';
const TEN = { phuc_vu: 'Phục vụ', xeo: 'Bếp xèo', can: 'Bếp căn', quan_ly: 'Quản lý', ca_hai: 'Cả 2 bếp' };
const KQ = { chua_vao_ca: 'Bạn chưa vào ca (hoặc mất kết nối quá 10 phút).', khong_duoc_phep: 'Vị trí của bạn không gửi được tới đó.',
  du_lieu_sai: 'Tin chưa đúng (trống hoặc quá 200 chữ).', khong_co_file: 'Tin thoại chưa tải lên được – thử lại.' };

const NHUNG = new URLSearchParams(location.search).has('nhung') && window.parent !== window;
if (NHUNG) { document.documentElement.classList.add('nhung'); document.head.insertAdjacentHTML('beforeend', '<base target="_top">'); }
const guiNgoai = (tin) => { if (NHUNG) try { window.parent.postMessage({ doiThoai: tin }, location.origin); } catch (e) {} };

const sb = supabase.createClient(URL_KHO, KHOA_CONG_KHAI, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'quanbay-dang-nhap' } });
const man = document.getElementById('man');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gio = (ts) => new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
const luuDoc = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const luuGhi = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ngayVN = (d) => new Date(d).toLocaleDateString('en-CA', { timeZone: 'Asia/Ho_Chi_Minh' });
const homNay = () => ngayVN(Date.now());
function bao(chu, ms = 3500) {
  guiNgoai({ bao: chu, ms });
  const el = document.getElementById('bao'); el.textContent = chu; el.style.display = 'block'; clearTimeout(bao.t); bao.t = setTimeout(() => el.style.display = 'none', ms);
}

const S = { user: null, nv: null, ql: false, ca: null, ds: [], toi: luuDoc('quanbay-tin-toi') || 'xeo', chu: '', nghe: false, dangXem: !NHUNG };
const quay = () => S.ca && TEN[S.ca.vai_tro] ? S.ca.vai_tro : null;
// Bên gửi: bếp xèo / bếp căn = phía bếp; phục vụ hoặc Hieu (chưa vào ca bếp) = phía phục vụ
const laBep = () => quay() === 'xeo' || quay() === 'can';
const laPV = () => quay() === 'phuc_vu' || (S.ql && !laBep());
const coTheDung = () => laBep() || laPV();
// Tin GỬI TỚI máy này
const toiToi = (t) => laBep() ? (t.toi_quay === quay() || t.toi_quay === 'ca_hai') : laPV() ? t.toi_quay === 'phuc_vu' : false;
// Tin liên quan máy này (gửi tới hoặc cùng phía gửi đi)
const lienQuan = (t) => toiToi(t) || (laBep() ? t.tu_quay === quay() : laPV() ? ['phuc_vu', 'quan_ly'].includes(t.tu_quay) : false);

// Phục vụ: tin bếp gửi chưa nghe / chưa xem (nhớ trong máy theo ngày)
const DA = (() => { try { const x = JSON.parse(luuDoc('quanbay-tin-da') || '{}'); return x.ngay === homNay() ? x : { ngay: homNay(), id: {} }; } catch (e) { return { ngay: homNay(), id: {} }; } })();
const luuDa = () => luuGhi('quanbay-tin-da', JSON.stringify(DA));
const chuaNghe = () => S.ds.filter(t => laPV() && toiToi(t) && !DA.id[t.id]);

// ===== Âm thanh: chuông + giọng đọc + tin thoại, xếp hàng phát lần lượt =====
let ac = null;
function moAm() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} }
document.addEventListener('pointerdown', moAm);
function beep(s, f, d, to = 0.5, kieu = 'sine') {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = kieu; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t + s); g.gain.exponentialRampToValueAtTime(to, t + s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
  o.connect(g).connect(ac.destination); o.start(t + s); o.stop(t + s + d + 0.05);
}
// Tiếng "tin nhắn" ở bếp: 2 nốt đi lên (khác chuông món mới 3 tiếng gắt và khác tiếng fill)
function tiengTin() { moAm(); beep(0, 784, 0.25); beep(0.22, 1175, 0.4); try { navigator.vibrate && navigator.vibrate([250, 100, 250]); } catch (e) {} return 750; }
function ting() { moAm(); beep(0, 1568, 0.4); try { navigator.vibrate && navigator.vibrate(150); } catch (e) {} }
const coGiong = 'speechSynthesis' in window;
let giongViet = null;
function taiGiong() { if (coGiong) giongViet = speechSynthesis.getVoices().find(v => (v.lang || '').toLowerCase().replace('_', '-').startsWith('vi')) || null; }
if (coGiong) { taiGiong(); speechSynthesis.onvoiceschanged = taiGiong; }
const nghi = (ms) => new Promise(r => setTimeout(r, ms));
function docCau(cau) {
  return new Promise((xong) => {
    if (!coGiong || !cau) return xong();
    const u = new SpeechSynthesisUtterance(cau); u.lang = 'vi-VN'; u.volume = 1; u.rate = 1; if (giongViet) u.voice = giongViet;
    let da = false; const ket = () => { if (!da) { da = true; clearTimeout(c); xong(); } };
    u.onend = ket; u.onerror = ket; const c = setTimeout(ket, 6000 + cau.length * 120);
    try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { ket(); }
  });
}
const AM = {};
async function layAm(path) {
  if (AM[path]) return AM[path];
  const { data, error } = await sb.storage.from('tin-thoai').download(path);
  if (error) throw error;
  return (AM[path] = URL.createObjectURL(data));
}
function phatFile(path) {
  return new Promise(async (xong) => {
    try { const a = new Audio(await layAm(path)); a.volume = 1; const c = setTimeout(xong, 20000);
      a.onended = a.onerror = () => { clearTimeout(c); xong(); }; await a.play(); }
    catch (e) { bao('Không phát được tin thoại – bấm ▶ để nghe', 5000); xong(); }
  });
}
const hang = []; let dangPhat = false;
function phat(chuong, cau, file) { hang.push({ chuong, cau, file }); chayHang(); }
async function chayHang() {
  if (dangPhat || GHI.dang) return; dangPhat = true;
  while (hang.length && !GHI.dang) {
    const x = hang.shift(); moAm();
    if (x.chuong) await nghi(tiengTin());
    if (x.file) await phatFile(x.file); else await docCau(x.cau);
    await nghi(300);
  }
  dangPhat = false;
}
const ten = (t) => t.tu_quay === 'quan_ly' ? 'Quản lý' : TEN[t.tu_quay];
// Bếp: tự kêu + tự đọc "Phục vụ nhắn: …" hoặc tự phát tin thoại
const tuPhat = (t) => phat(true, t.noi_dung ? ten(t) + ' nhắn: ' + t.noi_dung : null, t.file_thoai || null);

// ===== Ghi âm: giữ nút để nói, thả tay là gửi (≤ 15 giây) – như Fill đồ 6.5 =====
const GHI = { dang: false, rec: null, mic: null, manh: [], bd: 0, dem: null, nut: null, chuGoc: '' };
async function batDauGhi(nut) {
  if (GHI.dang) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder)
    return bao('Máy này không ghi âm được (cần Chrome, trang https).', 5000);
  GHI.dang = true; GHI.nut = nut; GHI.chuGoc = nut.textContent; GHI.manh = [];
  nut.classList.add('dang'); nut.textContent = '⏳ Đang mở micro…';
  try { speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  try { GHI.mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (err) {
    GHI.dang = false; nut.classList.remove('dang'); nut.textContent = GHI.chuGoc;
    return bao(err.name === 'NotAllowedError' ? 'Máy đang chặn micro: bấm ổ khóa cạnh địa chỉ trang → Quyền → Micro → Cho phép.' : 'Không mở được micro.', 7000);
  }
  if (!GHI.dang) { GHI.mic.getTracks().forEach(t => t.stop()); return; }
  const kieu = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(k => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(k)) || '';
  GHI.rec = new MediaRecorder(GHI.mic, kieu ? { mimeType: kieu, audioBitsPerSecond: 32000 } : undefined);
  GHI.rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) GHI.manh.push(ev.data); };
  GHI.rec.onstop = xongGhi; GHI.rec.start(); GHI.bd = Date.now();
  GHI.dem = setInterval(() => { const s = (Date.now() - GHI.bd) / 1000; nut.textContent = '🔴 Đang ghi ' + Math.floor(s) + '/15 giây – thả tay để gửi'; if (s >= 15) dungGhi(); }, 200);
}
function dungGhi() {
  if (!GHI.dang) return;
  GHI.dang = false; clearInterval(GHI.dem);
  if (GHI.nut) { GHI.nut.classList.remove('dang'); GHI.nut.textContent = GHI.chuGoc; }
  if (GHI.rec && GHI.rec.state !== 'inactive') { try { GHI.rec.stop(); } catch (e) {} } else if (GHI.mic) GHI.mic.getTracks().forEach(t => t.stop());
}
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (GHI.dang) dungGhi(); }));
async function xongGhi() {
  if (GHI.mic) GHI.mic.getTracks().forEach(t => t.stop());
  const giay = (Date.now() - GHI.bd) / 1000;
  const blob = new Blob(GHI.manh, { type: (GHI.rec && GHI.rec.mimeType) || 'audio/webm' });
  chayHang();
  if (giay < 0.6 || !blob.size) return bao('Giữ nút lâu hơn một chút rồi nói.');
  bao('⏳ Đang gửi tin thoại…', 8000);
  const loai = (blob.type || 'audio/webm').split(';')[0];
  const duoi = loai.includes('mp4') ? 'm4a' : loai.includes('ogg') ? 'ogg' : 'webm';
  const ma = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
  const path = homNay() + '/' + ma + '.' + duoi;
  const { error } = await sb.storage.from('tin-thoai').upload(path, blob, { contentType: loai, upsert: false });
  if (error) return bao('Chưa gửi được tin thoại (' + error.message + ') – nói trực tiếp giúp.', 7000);
  AM[path] = URL.createObjectURL(blob);
  gui(null, path, Math.min(15.9, Math.round(giay * 10) / 10));
}

// ===== Gửi =====
const dichToi = () => laBep() ? 'phuc_vu' : S.toi;
async function gui(chu, file, giay) {
  const { data, error } = await sb.rpc('gui_tin', { p_toi: dichToi(), p_noi_dung: chu, p_file: file, p_giay: giay ?? null });
  if (error) return bao('Lỗi: ' + error.message);
  if (data.kq !== 'ok') return bao(KQ[data.kq] || data.kq);
  bao('✅ Đã gửi ' + TEN[dichToi()].toLowerCase() + (file ? ' (tin thoại ' + Math.round(giay) + ' giây)' : ''));
  if (!file) S.chu = '';
  await tai();
}

// ===== Đăng nhập + tải =====
async function batDau(user) {
  S.user = user;
  const { data: nv } = await sb.from('nhan_vien').select('ten_hien_thi, dang_lam, vai_tro_duoc_phep').eq('id', user.id).maybeSingle();
  if (!nv || !nv.dang_lam) { man.innerHTML = `<div class="loi">Tài khoản chưa có vai trò hoặc đã khóa. Báo Hieu.</div>`; return; }
  S.nv = nv; S.ql = (nv.vai_tro_duoc_phep || []).includes('quan_ly');
  langNghe();
  await tai(true);
}
async function tai(dau) {
  if (!S.user) return;
  const [c, t] = await Promise.all([
    sb.from('vao_ca').select('vai_tro, nhip_cuoi').eq('nhan_vien_id', S.user.id).is('roi_luc', null).maybeSingle(),
    sb.from('tin_nhan').select('*').eq('ngay', homNay()).order('gui_luc', { ascending: false }).limit(80),
  ]);
  S.ca = c.data && c.data.nhip_cuoi && Date.now() - new Date(c.data.nhip_cuoi) < 10 * 60000 ? c.data : null;
  const cu = new Set(S.ds.map(x => x.id));
  S.ds = t.data || [];
  // Lần đầu mở trang: không phát lại tin cũ. Sau đó: tin mới tới máy này → kêu
  if (!dau) S.ds.filter(x => !cu.has(x.id) && toiToi(x) && x.gui_boi !== S.user.id).reverse().forEach(den);
  ve();
}
function den(t) {
  if (laBep()) {                                  // bếp: tự phát luôn (cần đã bấm "Bắt đầu nghe" 1 lần)
    if (S.nghe) tuPhat(t); else { tiengTin(); }
    bao('💬 ' + ten(t) + ': ' + (t.noi_dung || '🎙 tin thoại'), 7000);
  } else if (laPV()) {                            // phục vụ: "ting", bấm ▶ mới nghe
    ting();
    bao('💬 ' + ten(t) + ': ' + (t.noi_dung || '🎙 tin thoại – bấm ▶ để nghe'), 8000);
    if (S.dangXem && t.noi_dung) { DA.id[t.id] = 1; luuDa(); }
  }
}

// ===== Vẽ =====
function ve() {
  if (!S.nv) return;
  const a = document.activeElement, dangGo = a && a.id === 'chu';
  let h = '';
  if (!coTheDung()) {
    h = `<div class="canh">${S.ca ? `Đối thoại dành cho <b>phục vụ, bếp xèo, bếp căn</b>. Bạn đang ở ${TEN[S.ca.vai_tro] || 'quầy khác'}.`
      : `Bạn <b>chưa vào ca</b>. <a href="bai6-vao-ca.html">→ Vào ca</a>`}</div>`;
  } else {
    if (laBep() && !S.nghe) h += `<div class="canh"><b>Bấm 1 lần đầu ca</b> để máy tự đọc tin phục vụ nhắn (giữ màn hình sáng, mở trang này).
      <button class="lon" id="nghe">▶ Bắt đầu nghe</button></div>`;
    h += `<div class="the"><h2>${laBep() ? 'Nhắn phục vụ' : 'Nhắn bếp'}</h2>
      ${laPV() ? `<div class="toi">${['xeo', 'can', 'ca_hai'].map(k => `<button class="${S.toi === k ? 'chon' : ''}" data-toi="${k}">${k === 'xeo' ? '🔥 ' : k === 'can' ? '🥘 ' : ''}${TEN[k]}</button>`).join('')}</div>` : ''}
      <div class="hang-go"><input id="chu" maxlength="200" placeholder="${laBep() ? 'vd: hết tôm, bàn 5 xong rồi' : 'vd: bàn 5 hủy 1 xèo tôm'}" value="${esc(S.chu)}"><button class="nut" id="gui">Gửi</button></div>
      <button class="ghi" id="ghi">🎙 Giữ để nói với ${laBep() ? 'phục vụ' : TEN[S.toi].toLowerCase()}</button>
      <div class="goi-y" style="margin-top:6px">${laBep() ? 'Máy phục vụ kêu "ting", phục vụ bấm ▶ để nghe.' : 'Máy bếp tự kêu và tự đọc / tự phát, bếp không phải bấm.'}</div></div>`;
    const ds = S.ds.filter(lienQuan);
    h += `<div class="the"><h2>Tin hôm nay</h2>${ds.length ? ds.map(t => {
      const den = toiToi(t), moi = laPV() && den && !DA.id[t.id];
      const nut = t.file_thoai ? `<button class="nut ${moi ? '' : 'vien'}" data-nghe="${t.id}">▶ Nghe${t.thoai_giay ? ' ' + Math.round(t.thoai_giay) + '"' : ''}</button>`
        : laBep() && den ? `<button class="nut vien" data-doc="${t.id}">🔊</button>` : '';
      return `<div class="tin ${den ? 'den' : ''} ${moi ? 'moi' : ''}"><div class="noi">
          <div class="ai">${moi ? '<span class="cham"></span>' : ''}${esc(ten(t))} → ${esc(TEN[t.toi_quay])} · ${gio(t.gui_luc)}</div>
          <div class="chu">${t.noi_dung ? esc(t.noi_dung) : '🎙 Tin thoại'}</div></div>${nut}</div>`;
    }).join('') : '<div class="goi-y">Chưa có tin nào.</div>'}</div>`;
  }
  if (h !== ve.cu && !dangGo) { man.innerHTML = h; ve.cu = h; }
  guiNgoai({ chuaNghe: chuaNghe().length, laBep: laBep(), canNghe: laBep(), nghe: S.nghe });
}
// Màn ngoài mở mục Đối thoại → tin chữ coi như đã xem (tin thoại phải bấm ▶)
function daXem(co) {
  S.dangXem = co;
  if (co) { chuaNghe().filter(t => t.noi_dung).forEach(t => { DA.id[t.id] = 1; }); luuDa(); }
  ve.cu = null; ve();
}
async function batDauNghe() { moAm(); S.nghe = true; taiGiong(); phat(false, 'Đã bật đọc tin nhắn', null); ve.cu = null; ve(); }

// ===== Bấm =====
man.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  moAm();
  if (b.id === 'nghe') return batDauNghe();
  if (b.dataset.toi) { S.toi = b.dataset.toi; luuGhi('quanbay-tin-toi', S.toi); ve.cu = null; return ve(); }
  if (b.id === 'gui') { const o = document.getElementById('chu'); const chu = (o.value || '').trim(); if (!chu) return bao('Gõ tin trước.'); o.blur(); S.chu = ''; return gui(chu, null); }
  if (b.dataset.nghe) { const t = S.ds.find(x => x.id === +b.dataset.nghe); if (t) { DA.id[t.id] = 1; luuDa(); phat(false, null, t.file_thoai); ve.cu = null; ve(); } return; }
  if (b.dataset.doc) { const t = S.ds.find(x => x.id === +b.dataset.doc); if (t) phat(false, ten(t) + ' nhắn: ' + t.noi_dung, null); }
});
man.addEventListener('input', (e) => { if (e.target.id === 'chu') S.chu = e.target.value; });
man.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'chu') { e.preventDefault(); document.getElementById('gui').click(); } });
man.addEventListener('pointerdown', (e) => { const b = e.target.closest('#ghi'); if (b) { e.preventDefault(); batDauGhi(b); } });
man.addEventListener('contextmenu', (e) => { if (e.target.closest('#ghi')) e.preventDefault(); });
man.addEventListener('focusout', () => setTimeout(() => { ve.cu = null; ve(); }, 100));

// ===== Realtime + dự phòng =====
let kenh = null, hen = null;
function langNghe() {
  if (kenh) return;
  const kn = document.getElementById('ketnoi');
  kenh = sb.channel('doi-thoai').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'tin_nhan' }, () => { clearTimeout(hen); hen = setTimeout(() => tai(), 200); })
    .subscribe(st => { kn.textContent = st === 'SUBSCRIBED' ? '● đã kết nối' : '○ ' + st.toLowerCase(); });
}
setInterval(() => { if (S.user) tai(); }, 20000);
if (!NHUNG) {   // dùng riêng: tự giữ chỗ trong ca (nhúng thì màn ngoài lo)
  setInterval(() => { const may = luuDoc('quanbay-may'); if (S.user && may) sb.rpc('nhip', { p_may: may }); }, 60000);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.user) tai(); });

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) return batDau(session.user);
  man.innerHTML = `<div class="canh">Chưa đăng nhập. <a href="bai6-vao-ca.html">→ Vào ca</a></div>`;
})();
</script>
